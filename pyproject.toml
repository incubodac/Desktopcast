[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desktopcast"
version = "1.0.0"
description = "A desktop application for controlling Yamaha MusicCast receivers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Desktopcast Contributors"}
]
keywords = ["yamaha", "musiccast", "receiver", "audio", "control", "tidal", "spotify"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "PyQt6>=6.4.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/Desktopcast"
Repository = "https://github.com/YOUR_USERNAME/Desktopcast"
Issues = "https://github.com/YOUR_USERNAME/Desktopcast/issues"

[project.scripts]
desktopcast = "main:main"

[project.gui-scripts]
desktopcast-gui = "main:main"

[tool.setuptools]
py-modules = ["main"]
